name: Swift package license inventory

on:
  pull_request:
    paths:
      - "Package.swift"
      - "**/Package.resolved"
      - "scripts/ci/generate_swift_package_licenses.py"
      - ".github/workflows/swift-package-licenses.yml"
  push:
    branches: [main]
    paths:
      - "Package.swift"
      - "**/Package.resolved"
      - "scripts/ci/generate_swift_package_licenses.py"
      - ".github/workflows/swift-package-licenses.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Licenses / Swift packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Generate license inventory from pinned revisions
        run: python3 scripts/ci/generate_swift_package_licenses.py
      - name: Upload full license inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swift-package-licenses
          path: build/licenses/swift-package-licenses.md
          if-no-files-found: error
          retention-days: 30
