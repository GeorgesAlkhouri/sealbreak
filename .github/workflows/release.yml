name: Release Archive

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semantic version increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release-archive
  cancel-in-progress: false

jobs:
  archive:
    name: Release / archive
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: "1"

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release archives must be created from main."
          exit 1

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Verify Xcode 26.6
        run: xcodebuild -version

      - name: Create unsigned release archive
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: bundle exec fastlane ios archive release_type:"$RELEASE_TYPE"
