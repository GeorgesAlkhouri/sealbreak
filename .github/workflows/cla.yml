name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, reopened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: CLA Assistant
        if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && (contains(github.event.comment.body, 'CLA') || github.event.comment.body == 'recheck'))
        uses: iainmcgin/cla-github-action@0d27e5a16278d4adb6b0c4b92f08ad27b0a21dc8 # v3.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: "https://github.com/GeorgesAlkhouri/sealbreak/blob/main/docs/legal/CLA-INDIVIDUAL.md"
          path-to-signatures: "signatures/cla.json"
          branch: "cla-signatures"
          allowlist: "GeorgesAlkhouri,dependabot[bot],github-actions[bot],renovate[bot]"
