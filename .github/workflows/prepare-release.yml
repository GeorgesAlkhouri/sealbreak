name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semantic version increment from MARKETING_VERSION on main
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Release / Prepare
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: "1"

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release preparation must be started from main."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Verify Xcode 26.6
        run: xcodebuild -version

      - name: Bump marketing version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: bundle exec fastlane ios prepare_release release_type:"$RELEASE_TYPE"

      # A pull request opened with GITHUB_TOKEN starts no pull_request or
      # pull_request_target runs, so it would lack CI and CLAAssistant.
      - name: Create release automation token
        id: automation-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # CLAAssistant allowlists this exact bot and requires the PR opener to author a commit.
      - name: Resolve automation commit identity
        id: automation-identity
        env:
          GH_TOKEN: ${{ steps.automation-token.outputs.token }}
          APP_SLUG: ${{ steps.automation-token.outputs.app-slug }}
        run: |
          test "$APP_SLUG" = sealbreak-automation
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "identity=${APP_SLUG}[bot] <${user_id}+${APP_SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"

      - name: Create release pull request
        id: release_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.automation-token.outputs.token }}
          author: ${{ steps.automation-identity.outputs.identity }}
          committer: ${{ steps.automation-identity.outputs.identity }}
          add-paths: Sealbreak.xcodeproj/project.pbxproj
          commit-message: "chore: bump version to ${{ steps.version.outputs.next_version }}"
          branch: release/v${{ steps.version.outputs.next_version }}
          base: main
          title: "chore: bump version to ${{ steps.version.outputs.next_version }}"
          body: |
            Prepare Sealbreak ${{ steps.version.outputs.next_version }} by updating MARKETING_VERSION from ${{ steps.version.outputs.current_version }}.

            TestFlight build numbers are assigned separately at upload time.

      - name: Summarize release pull request
        if: steps.release_pr.outputs.pull-request-number != ''
        env:
          RELEASE_PR_URL: ${{ steps.release_pr.outputs.pull-request-url }}
        run: echo "Created or updated $RELEASE_PR_URL" >> "$GITHUB_STEP_SUMMARY"
