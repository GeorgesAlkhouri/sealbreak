name: CI

on:
  pull_request:
    branches: [main, prototype/ios-mvp]
  push:
    branches: [main, prototype/ios-mvp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: CI / verify
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore Swift quality tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/sealbreak-tools
            ~/.cache/sealbreak-mint
          key: swift-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/versions.env', 'Mintfile') }}
      - name: Select pinned Xcode and prepare quality tools
        run: bash scripts/ci/setup.sh
      - name: Lint, model tests and coverage
        run: bash scripts/ci/check.sh
      - name: Compile complete iOS app for Simulator
        run: bash scripts/ci/build.sh simulator
      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports
          path: reports/
          retention-days: 7
          if-no-files-found: warn

  security:
    name: CI / security
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Xcode
        run: bash scripts/ci/setup.sh xcode-only
      - name: Initialize Swift security analysis
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
      - name: Build unsigned device Release archive
        run: bash scripts/ci/build.sh archive
      - name: Analyze Swift security
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: /language:swift
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Package verified main archive
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: ditto -c -k --keepParent build/Sealbreak.xcarchive build/Sealbreak-unsigned.zip
      - name: Retain unsigned main archive
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-ios-${{ github.sha }}
          path: build/Sealbreak-unsigned.zip
          retention-days: 14
          if-no-files-found: error

  sonar:
    name: CI / sonar
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Reject Sonar analysis for fork PRs
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo '::error::Fork build verified without secrets. Review the contribution, then import it to a maintainer-owned branch for Sonar. No pull_request_target shortcut.'
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: reports
          path: reports
      - name: Check required reports
        run: test -s reports/coverage.xml && test -s reports/swiftlint.json
      - name: SonarQube Cloud and quality gate
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ready:
    name: CI / ready
    if: ${{ always() }}
    needs: [verify, security, sonar]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require actual success from every gate
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
        run: |
          test "$VERIFY_RESULT" = success && \
          test "$SECURITY_RESULT" = success && \
          test "$SONAR_RESULT" = success
