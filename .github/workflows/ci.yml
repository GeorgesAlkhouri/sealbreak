name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: CI / quality
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Restore pre-commit environments
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-py3.13-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: python -m pip install -r requirements-ci.txt
      - name: Install Swift quality tools
        run: brew install swiftlint swiftformat
      - name: Static checks
        run: pre-commit run --all-files --show-diff-on-failure

  tests:
    name: CI / tests
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run tests with coverage
        run: |
          swift test --enable-code-coverage -Xswiftc -warnings-as-errors
          profile="$(find .build -name default.profdata -type f -print -quit)"
          binary="$(find .build -type f -name 'SealbreakCorePackageTests' -perm -111 -print -quit)"
          test -n "$profile" && test -n "$binary"
          xcrun llvm-cov export "$binary" -instr-profile "$profile" -format=lcov > coverage.lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.0.0
        with:
          files: coverage.lcov
          fail_ci_if_error: true
          use_oidc: true

  build:
    name: CI / build
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile complete iOS app for Simulator
        run: bash scripts/ci/build.sh simulator

  integration:
    name: CI / integration / ${{ matrix.server.name }} / iOS ${{ matrix.platform.ios }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        server:
          - name: openbao
            version: "2.6.2"
          - name: vault
            version: "2.1.1"
        platform:
          - ios: "26.5"
            xcode: "26.6"
            runner: macos-26
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
            runtime: com.apple.CoreSimulator.SimRuntime.iOS-26-5
            device: com.apple.CoreSimulator.SimDeviceType.iPhone-17
          - ios: "27.0"
            xcode: "27.0"
            runner: xcode-27
            developer_dir: /Applications/Xcode_27.0.app/Contents/Developer
            runtime: com.apple.CoreSimulator.SimRuntime.iOS-27-0
            device: com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro
    env:
      DEVELOPER_DIR: ${{ matrix.platform.developer_dir }}
      SEALBREAK_IOS_RUNTIME: ${{ matrix.platform.runtime }}
      SEALBREAK_SIMULATOR_DEVICE_TYPE: ${{ matrix.platform.device }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify Xcode ${{ matrix.platform.xcode }} baseline
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
      - name: Restore Swift package sources
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/sealbreak-source-packages
          key: swiftpm-integration-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform.xcode }}-${{ hashFiles('Sealbreak.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            swiftpm-integration-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform.xcode }}-
      - name: Run real ${{ matrix.server.name }} Shamir integration
        env:
          SEALBREAK_SOURCE_PACKAGES_DIR: ${{ runner.temp }}/sealbreak-source-packages
        run: bash scripts/ci/integration.sh "${{ matrix.server.name }}" "${{ matrix.server.version }}"

  sonar:
    name: CI / sonar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Reject Sonar analysis for fork PRs
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo '::error::Fork build verified without secrets. Review the contribution, then import it to a maintainer-owned branch for Sonar. No pull_request_target shortcut.'
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: SonarQube Cloud and quality gate
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ready:
    name: CI / ready
    if: ${{ always() }}
    needs: [quality, tests, build, integration, sonar]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require actual success from every gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
        run: |
          test "$QUALITY_RESULT" = success && \
          test "$TESTS_RESULT" = success && \
          test "$BUILD_RESULT" = success && \
          test "$INTEGRATION_RESULT" = success && \
          test "$SONAR_RESULT" = success
