name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number for manually dispatched PR checks
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: CI / quality
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Restore pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-py3.13-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: python -m pip install -r requirements-ci.txt
      - name: Install Swift quality tools
        run: |
          xcodebuild -version
          xcrun swift-format --version
          brew install swiftlint
      - name: Restore analyzer package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            build/Simulator/SourcePackages
            build/SwiftLintAnalyze/SwiftPM/checkouts
            build/SwiftLintAnalyze/SwiftPM/repositories
            build/SwiftLintAnalyze/SwiftPM/artifacts
          key: swiftlint-analyze-packages-${{ runner.os }}-${{ runner.arch }}-26.6-${{ hashFiles('Sealbreak.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            swiftlint-analyze-packages-${{ runner.os }}-${{ runner.arch }}-26.6-
      - name: Static checks and SwiftLint analysis
        run: pre-commit run --all-files --show-diff-on-failure

  tests:
    name: CI / Swift package tests
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run tests with coverage
        run: |
          mkdir -p build/test-results
          cp Sealbreak.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved Package.resolved
          swift build --force-resolved-versions --product SealbreakPackageTests --enable-code-coverage -Xswiftc -warnings-as-errors
          # SwiftPM requires parallel mode to write the XCTest XML report.
          swift test --force-resolved-versions --skip-build --enable-code-coverage -Xswiftc -warnings-as-errors \
            --parallel --xunit-output build/test-results/package.junit.xml
          profile="$(find .build -name default.profdata -type f -print -quit)"
          binary="$(find .build -type f -name 'SealbreakPackageTests' -perm -111 -print -quit)"
          test -n "$profile" && test -n "$binary"
          xcrun llvm-cov export "$binary" -instr-profile "$profile" -format=lcov > coverage.lcov
      - name: Upload Core and Infrastructure test results to Codecov
        if: ${{ !cancelled() && hashFiles('build/test-results/package.junit.xml', 'build/test-results/package.junit-swift-testing.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/test-results/package.junit.xml,build/test-results/package.junit-swift-testing.xml
          report_type: test_results
          flags: swift-package
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.lcov
          fail_ci_if_error: true
          use_oidc: true

  build:
    name: CI / iOS app
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      notices_changed: ${{ steps.notices.outputs.changed }}
      notices_artifact_id: ${{ steps.upload-notices.outputs.artifact-id }}
    permissions:
      contents: read
      id-token: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Restore Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/Simulator/SourcePackages
          key: swiftpm-ios-${{ runner.os }}-${{ runner.arch }}-26.6-${{ hashFiles('Sealbreak.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            swiftpm-ios-${{ runner.os }}-${{ runner.arch }}-26.6-
      - name: Verify Swift package lockfile
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project Sealbreak.xcodeproj \
            -scheme Sealbreak \
            -derivedDataPath build/Simulator \
            -skipPackageUpdates \
            -resolvePackageDependencies
          if git diff --quiet -- \
            Sealbreak.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved; then
            exit 0
          fi
          echo '::error title=Package.resolved out of date::Xcode changed Package.resolved. Resolve packages with Xcode 26.6 and commit the generated lockfile.'
          git diff -- \
            Sealbreak.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          exit 1
      - name: Generate third-party notices from resolved package sources
        id: notices
        env:
          # renovate: depName=mono0926/LicensePlist
          LICENSEPLIST_VERSION: "3.28.3"
          LICENSEPLIST_SHA256: dd3ca6c08981a1e0c4980d5bc857bbd40f17b8b4c7ca89ab8923396fd910a040
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/mono0926/LicensePlist/releases/download/$LICENSEPLIST_VERSION/portable_licenseplist.zip" \
            --output "$RUNNER_TEMP/licenseplist.zip"
          echo "$LICENSEPLIST_SHA256  $RUNNER_TEMP/licenseplist.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/licenseplist.zip" -d "$RUNNER_TEMP/licenseplist"
          mkdir -p build/notices
          "$RUNNER_TEMP/licenseplist/license-plist" \
            --package-path Sealbreak.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            --package-sources-path build/Simulator/SourcePackages \
            --config-path license_plist.yml \
            --output-path build/notices/Settings.bundle \
            --markdown-path build/notices/libraries.md \
            --sandbox-mode --fail-if-missing-license \
            --add-version-numbers --add-sources --suppress-opening-directory --no-color --force
          cat docs/licenses/third-party-notices-header.md > build/notices/THIRD_PARTY_NOTICES.md
          echo >> build/notices/THIRD_PARTY_NOTICES.md
          sed -n '/^## \[/,$p' build/notices/libraries.md \
            | sed 's/^## \[/### [/' \
            | python3 -c 'import sys; print(sys.stdin.read().rstrip("\n"))' >> build/notices/THIRD_PARTY_NOTICES.md
          if diff -u THIRD_PARTY_NOTICES.md build/notices/THIRD_PARTY_NOTICES.md; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload generated third-party notices
        id: upload-notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-notices-${{ github.run_attempt }}
          path: build/notices/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 7
      - name: Build complete iOS app and hosted tests with coverage
        run: |
          xcodebuild build-for-testing -project Sealbreak.xcodeproj -scheme Sealbreak \
            -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -derivedDataPath build/Simulator -only-testing:SealbreakAppModuleTests \
            -enableCodeCoverage YES -disableAutomaticPackageResolution \
            -skipMacroValidation CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= COMPILER_INDEX_STORE_ENABLE=NO SWIFT_EMIT_LOC_STRINGS=YES
      - name: Install Xcode test report converter
        run: brew install xcresultparser
      - name: Run hosted iOS security and presentation tests with coverage
        id: hosted-security-tests
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild test-without-building -project Sealbreak.xcodeproj -scheme Sealbreak \
            -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -derivedDataPath build/Simulator -only-testing:SealbreakAppModuleTests \
            -enableCodeCoverage YES -resultBundlePath build/AppModuleTests.xcresult \
            -test-timeouts-enabled YES -collect-test-diagnostics on-failure \
            -disableAutomaticPackageResolution \
            -skipMacroValidation CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= COMPILER_INDEX_STORE_ENABLE=NO
      - name: Export hosted iOS AppModule test results
        if: ${{ !cancelled() && (steps.hosted-security-tests.outcome == 'success' || hashFiles('build/AppModuleTests.xcresult/Info.plist') != '') }}
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          mkdir -p build/test-results
          xcresultparser -o junit build/AppModuleTests.xcresult > build/test-results/appmodule.junit.xml.tmp
          xmllint --noout build/test-results/appmodule.junit.xml.tmp
          mv build/test-results/appmodule.junit.xml.tmp build/test-results/appmodule.junit.xml
      - name: Upload hosted iOS AppModule test results to Codecov
        if: ${{ !cancelled() && hashFiles('build/test-results/appmodule.junit.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/test-results/appmodule.junit.xml
          report_type: test_results
          flags: appmodule-ios-26.5
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Upload hosted iOS test failure diagnostics
        if: failure() && steps.hosted-security-tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-ios-test-failure-${{ github.run_attempt }}
          path: build/AppModuleTests.xcresult
          if-no-files-found: error
          retention-days: 7
      - name: Export hosted iOS AppModule and Infrastructure coverage
        run: |
          set -euo pipefail
          profile="$(find build/Simulator/Build/ProfileData -name Coverage.profdata -type f -print -quit)"
          binary="build/Simulator/Build/Products/Debug-iphonesimulator/Sealbreak.app/Sealbreak.debug.dylib"
          if [[ ! -f "$binary" ]]; then
            binary="build/Simulator/Build/Products/Debug-iphonesimulator/Sealbreak.app/Sealbreak"
          fi
          test -n "$profile" && test -f "$binary"
          xcrun llvm-cov export "$binary" -instr-profile "$profile" -format=lcov \
            | awk '/^SF:/ { keep = index($0, "Sources/SealbreakAppModule/") > 0 || index($0, "Sources/SealbreakInfrastructure/") > 0 } keep' \
            > ios-coverage.lcov
          grep -q '^SF:' ios-coverage.lcov
      - name: Upload hosted iOS coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ios-coverage.lcov
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Check localization catalog drift
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile

          catalogs = {target: Path("Sources") / target / "Resources/Localizable.xcstrings"
                      for target in ("SealbreakCore", "SealbreakInfrastructure", "SealbreakAppModule")}
          # InfoPlist keys come from plist metadata; its catalog is checked below.
          intermediates = Path("build/Simulator/Build/Intermediates.noindex/Sealbreak.build/Debug-iphonesimulator")
          with tempfile.TemporaryDirectory(prefix="sealbreak-localization-") as directory:
              for target, catalog in catalogs.items():
                  stringsdata = [path for path in sorted((intermediates / f"{target}.build/Objects-normal/arm64").glob("*.stringsdata"))
                                 if path.name != "ExtractedAppShortcutsMetadata.stringsdata"]
                  if not stringsdata:
                      raise SystemExit(f"::error title=Missing localization extraction::No source strings were extracted for {target}.")
                  synced = Path(directory) / target / catalog.name
                  synced.parent.mkdir()
                  shutil.copyfile(catalog, synced)
                  subprocess.run(["xcrun", "xcstringstool", "sync", str(synced),
                                  "--stringsdata", *map(str, stringsdata)], check=True)
                  if json.loads(catalog.read_text()) != json.loads(synced.read_text()):
                      raise SystemExit(f"::error title=Localization catalogs out of sync::Extracted strings differ from {catalog}. Review catalog changes on the pull request branch.")
          PYTHON
          if git diff --quiet -- \
            Sealbreak/Resources/InfoPlist.xcstrings \
            'Sources/*/Resources/Localizable.xcstrings'; then
            exit 0
          fi
          echo '::error title=Localization catalogs out of sync::The Xcode build changed String Catalogs. Commit the generated catalog changes on the pull request branch.'
          git diff -- \
            Sealbreak/Resources/InfoPlist.xcstrings \
            'Sources/*/Resources/Localizable.xcstrings'
          exit 1

  integration:
    name: CI / integration / ${{ matrix.server.name }} / iOS ${{ matrix.platform.ios }}
    runs-on: ${{ matrix.platform.runner }}
    # A cold Xcode 27 build can consume almost 20 minutes before cleanup.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        server:
          - name: openbao
            # renovate: packageName=openbao/openbao
            version: "2.7.1"
          - name: vault
            # renovate: packageName=hashicorp/vault
            version: "2.2.0"
        platform:
          - ios: "26.5"
            xcode: "26.6"
            runner: macos-26
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
            runtime: com.apple.CoreSimulator.SimRuntime.iOS-26-5
            device: com.apple.CoreSimulator.SimDeviceType.iPhone-17
          - ios: "27.0"
            xcode: "27.0"
            runner: xcode-27
            developer_dir: /Applications/Xcode_27.0.app/Contents/Developer
            runtime: com.apple.CoreSimulator.SimRuntime.iOS-27-0
            device: com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro
    env:
      DEVELOPER_DIR: ${{ matrix.platform.developer_dir }}
      SEALBREAK_IOS_RUNTIME: ${{ matrix.platform.runtime }}
      SEALBREAK_SIMULATOR_DEVICE_TYPE: ${{ matrix.platform.device }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify Xcode ${{ matrix.platform.xcode }} baseline
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
      - name: Restore Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/sealbreak-source-packages
          key: swiftpm-integration-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform.xcode }}-${{ hashFiles('Sealbreak.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            swiftpm-integration-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform.xcode }}-
      - name: Install Xcode test report converter
        run: brew install xcresultparser
      - name: Run real ${{ matrix.server.name }} Shamir integration
        env:
          SEALBREAK_SOURCE_PACKAGES_DIR: ${{ runner.temp }}/sealbreak-source-packages
        run: bash scripts/ci/integration.sh "${{ matrix.server.name }}" "${{ matrix.server.version }}"
      - name: Upload integration test results to Codecov
        if: ${{ !cancelled() && hashFiles(format('build/test-results/integration-{0}.junit.xml', matrix.server.name)) != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/test-results/integration-${{ matrix.server.name }}.junit.xml
          report_type: test_results
          flags: integration-${{ matrix.server.name }}-ios-${{ matrix.platform.ios }}
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true

  sonar:
    name: CI / sonar
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Reject Sonar analysis for fork PRs
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo '::error::Fork build verified without secrets. Review the contribution, then import it to a maintainer-owned branch for Sonar. No pull_request_target shortcut.'
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: SonarQube Cloud and quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3
        with:
          args: >-
            ${{ inputs.pr_number && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base=main', inputs.pr_number, github.ref_name) || '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  update-notices:
    name: CI / update Renovate notices
    needs: build
    if: >-
      needs.build.outputs.notices_changed == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Require an open Renovate PR at the generated revision
        run: |
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" | jq --exit-status \
            --arg sha "$SOURCE_SHA" --arg repo "$GH_REPO" --arg branch "$PR_BRANCH" \
            '.state == "open" and .user.login == "renovate[bot]" and .head.sha == $sha and .head.repo.full_name == $repo and .head.ref == $branch and .base.ref == "main"'
      # A GITHUB_TOKEN push starts no pull_request or pull_request_target runs, so the
      # new revision would lack required checks such as CLAAssistant. The
      # sealbreak-automation GitHub App (AUTOMATION_APP_CLIENT_ID variable,
      # AUTOMATION_APP_PRIVATE_KEY secret) is shared with prepare-release.yml and
      # record-snapshots.yml.
      - name: Create notice publishing token
        id: notices-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
      # This fresh job executes no package or PR code and stages only the notice file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.notices-token.outputs.token }}
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.notices_artifact_id }}
          path: build/generated-notices
      # Renovate keeps maintaining the branch because renovate.json lists this
      # commit identity in gitIgnoredAuthors.
      - name: Commit notices for the new revision
        run: |
          set -euo pipefail
          cp build/generated-notices/THIRD_PARTY_NOTICES.md THIRD_PARTY_NOTICES.md
          git add -- THIRD_PARTY_NOTICES.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'docs: update third-party notices'
          git push origin "HEAD:refs/heads/$PR_BRANCH"

  ready:
    name: CI / ready
    if: ${{ always() }}
    needs: [quality, tests, build, integration, sonar, update-notices]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require actual success from every gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          NOTICES_RESULT: ${{ needs.update-notices.result }}
          NOTICES_CHANGED: ${{ needs.build.outputs.notices_changed }}
        run: |
          if [[ "$NOTICES_CHANGED" == true ]]; then
            echo '::error title=Third-party notices out of date::Renovate PRs receive an automatic notice commit. Other PRs must commit the generated third-party-notices artifact.'
            exit 1
          fi
          test "$QUALITY_RESULT" = success && \
          test "$TESTS_RESULT" = success && \
          test "$BUILD_RESULT" = success && \
          test "$INTEGRATION_RESULT" = success && \
          test "$SONAR_RESULT" = success && \
          test "$NOTICES_CHANGED" = false && \
          { test "$NOTICES_RESULT" = success || test "$NOTICES_RESULT" = skipped; }
