name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: CI / quality
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Restore pre-commit environments
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-py3.13-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2
      - name: Install Swift quality tools
        run: brew install swiftlint swiftformat
      - name: Static checks
        run: pre-commit run --all-files --show-diff-on-failure

  tests:
    name: CI / tests
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run tests with coverage
        run: |
          swift test --enable-code-coverage -Xswiftc -warnings-as-errors
          profile="$(find .build -name default.profdata -type f -print -quit)"
          binary="$(find .build -type f -name 'SealbreakCorePackageTests' -perm -111 -print -quit)"
          test -n "$profile" && test -n "$binary"
          xcrun llvm-cov export "$binary" -instr-profile "$profile" -format=lcov > coverage.lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.0.0
        with:
          files: coverage.lcov
          fail_ci_if_error: true
          use_oidc: true

  build:
    name: CI / build
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile complete iOS app for Simulator
        run: bash scripts/ci/build.sh simulator

  sonar:
    name: CI / sonar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Reject Sonar analysis for fork PRs
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo '::error::Fork build verified without secrets. Review the contribution, then import it to a maintainer-owned branch for Sonar. No pull_request_target shortcut.'
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: SonarQube Cloud and quality gate
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ready:
    name: CI / ready
    if: ${{ always() }}
    needs: [quality, tests, build, sonar]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require actual success from every gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
        run: |
          test "$QUALITY_RESULT" = success && \
          test "$TESTS_RESULT" = success && \
          test "$BUILD_RESULT" = success && \
          test "$SONAR_RESULT" = success
