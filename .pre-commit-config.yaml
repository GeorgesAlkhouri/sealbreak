minimum_pre_commit_version: "4.6.2"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: end-of-file-fixer
        # Keep the vendored Simple Icons SVGs byte-identical to their pinned upstream files.
        exclude: '^Sealbreak/Resources/Brand\.xcassets/(OpenBaoMark\.imageset/OpenBaoMark|VaultMark\.imageset/VaultMark)\.svg$'
      - id: trailing-whitespace
        # Preserve whitespace inside the generated original license texts.
        exclude: '^THIRD_PARTY_NOTICES\.md$'

  - repo: local
    hooks:
      - id: swift-format
        name: swift-format
        entry: xcrun swift-format format --in-place
        language: unsupported
        types: [swift]
      - id: swift-format-lint
        name: swift-format lint
        entry: xcrun swift-format lint --strict
        language: unsupported
        types: [swift]
      - id: swiftlint
        name: SwiftLint
        entry: swiftlint --quiet --strict
        language: unsupported
        types: [swift]
      - id: swiftlint-analyze
        name: SwiftLint analyze (clean builds)
        entry: bash scripts/ci/analyze.sh
        language: unsupported
        pass_filenames: false
        require_serial: true
        # Deleting the last use of a declaration must also trigger analysis.
        always_run: true
      - id: plutil
        name: Validate Apple property files
        entry: plutil -lint
        language: unsupported
        files: '\.(plist|xcprivacy|pbxproj)$'
