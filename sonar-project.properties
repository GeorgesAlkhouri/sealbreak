# Organization and project key come from repository variables, not guessed IDs.
sonar.projectName=Sealbreak
sonar.sources=Sealbreak
sonar.tests=Tests
sonar.sourceEncoding=UTF-8
sonar.swift.swiftLint.reportPaths=reports/swiftlint.json
sonar.coverageReportPaths=reports/coverage.xml
# No exclusion of untested UI, Keychain or networking code to inflate coverage.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
